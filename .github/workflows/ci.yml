name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Boot smoke test
        run: |
          GROQ_API_KEY=ci-smoke-test-key node server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/config > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/api/config > /dev/null
          curl -sf http://localhost:3000/script.js > /dev/null
          curl -sf http://localhost:3000/flightPlanUtils.js > /dev/null
          kill $SERVER_PID

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cloudcompass:ci
